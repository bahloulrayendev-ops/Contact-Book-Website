#Postgresql_settings
spring.config.import=optional:file:./application-local.properties
spring.application.name=DataInfoEgypt
spring.datasource.url=jdbc:postgresql://localhost:5432/DataInfoEgypt
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.flyway.baseline-on-migrate=true

#JWT_settings
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# Set PAYMENT_WEBHOOK_SECRET in the environment before enabling payment callbacks.
payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}


